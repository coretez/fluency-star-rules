  RC-04: {name: Persistence,              desc: "Configured to auto-start"}
  RC-05: {name: Local inference,          desc: "Model runtime serving locally"}
  RC-06: {name: Developer integration,    desc: "CLI, SDK, IDE plugin, MCP"}
  RC-07: {name: Browser-resident,         desc: "Extensions, PWAs, AI browsers"}
  RC-08: {name: Network egress,           desc: "Resolution/connection to AI services"}
  RC-09: {name: Evasion and obfuscation,  desc: "DoH, aggregators, renamed binaries"}
  RC-10: {name: Data movement precursor,  desc: "Bulk collection before AI egress"}
  RC-11: {name: Identity and tenancy,     desc: "Personal vs corporate account"}

