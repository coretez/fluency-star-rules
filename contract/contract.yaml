# Rule Contract — GenAI Usage Visibility
#
# WHAT MUST BE DETECTED, not how. Vendor-neutral.
#
# ── ID RULES (non-negotiable) ────────────────────────────────────────────────
#   Format: RC-FF.II  zero-padded, lexically sortable.
#   IDs are IMMUTABLE. Deprecate, never renumber, never reuse a retired number.
#   Reusing a number is how a rule silently claims coverage it does not have.
#
# ── IDENTITY TIERS ───────────────────────────────────────────────────────────
#   IT-1 signer    durable: update + rename + relocation   ← macOS backbone
#   IT-2 metadata  durable: rename + relocation            ← Windows backbone
#   IT-3 path      durable: update only                    ← harvests IT-4
#   IT-4 sha256    durable: rename + relocation            ← breaks every release
#
#   Windows: OriginalFilename is INSIDE the PE. IT-2 is strong.
#   macOS:   Info.plist is a SIBLING file in the bundle — strippable. Lean IT-1.
#
# severity: low | medium | high
# status:   active | planned | accepted-gap | deprecated

schema_version: 1
contract_version: "1.0.0"
updated: 2026-09-05

families:
  RC-01: {name: Acquisition,              desc: "Obtaining the software"}
