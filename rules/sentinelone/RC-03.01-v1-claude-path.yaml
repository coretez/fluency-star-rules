id: RC-03.01/v1
contract: RC-03.01
variation: v1
name: Claude Desktop execution (path)
platform: sentinelone
os:
- windows
- macos
identity_tier: IT-3
primitive: TP-PROC
severity: low
status: active
refs:
  apps:
  - claude-desktop
query: 'event.type = "Process Creation"

  AND tgt.process.image.path in contains anycase ({{ app:claude-desktop.paths }})

  AND NOT tgt.process.image.path contains anycase "Helper"

  '
notes: NOT Helper suppresses Electron GPU/Renderer children (4-8 dupes per launch).
